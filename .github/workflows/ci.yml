name: CI

on:
  push:
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canari
          POSTGRES_PASSWORD: canari
          POSTGRES_DB: canari_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U canari" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://canari:canari@localhost:5432/canari_test?schema=public
      TEST_DATABASE_URL: postgresql://canari:canari@localhost:5432/canari_test?schema=public
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      PAYMENT_PROVIDER: mock
      PAYMENT_WEBHOOK_SECRET: ci-only-webhook-secret
      CRON_SECRET: ci-only-cron-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma migrate deploy
      - run: npm run test:coverage
      - run: npm run build
