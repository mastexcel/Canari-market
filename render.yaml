# Démo hébergée Sesam-Market sur Render (Blueprint).
# Paiement simulé et données de démonstration : NE PAS utiliser tel quel en production réelle
# (voir docs/DEPLOYMENT.md). DEMO_PASSWORD est à renseigner dans le tableau de bord Render.
databases:
  - name: sesam-market-db
    plan: free
    region: frankfurt
    databaseName: sesam
    user: sesam

services:
  - type: web
    name: sesam-market
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npx prisma migrate deploy && npm run db:seed-if-empty && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sesam-market-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: mock
      - key: ALLOW_MOCK_PAYMENTS
        value: "true"
      - key: PERISHABLES_ENABLED
        value: "false"
      - key: DEMO_SEED
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
