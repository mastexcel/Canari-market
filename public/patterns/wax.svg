<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Motif d'inspiration wax / bogolan : soleils, feuilles, zigzags kente, points, losanges -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Soleil (cercles concentriques) -->
    <g transform="translate(48 50)">
      <circle r="26" stroke="#F08A00" stroke-width="4" stroke-opacity=".22"/>
      <circle r="16" stroke="#0E5F36" stroke-width="4" stroke-opacity=".18"/>
      <circle r="6" fill="#FFBF1A" fill-opacity=".35"/>
      <g stroke="#FFBF1A" stroke-width="3" stroke-opacity=".3">
        <path d="M0-36v-8M0 36v8M-36 0h-8M36 0h8M-25-25l-6-6M25 25l6 6M25-25l6-6M-25 25l-6 6"/>
      </g>
    </g>
    <!-- Feuilles wax -->
    <g transform="translate(170 58) rotate(-30)">
      <path d="M0-30C16-16 16 16 0 30C-16 16-16-16 0-30Z" fill="#7CB82F" fill-opacity=".2"/>
      <path d="M0-26V26" stroke="#0E5F36" stroke-width="2" stroke-opacity=".22"/>
    </g>
    <g transform="translate(205 100) rotate(40)">
      <path d="M0-20C11-11 11 11 0 20C-11 11-11-11 0-20Z" fill="#1FA39A" fill-opacity=".18"/>
    </g>
    <!-- Bande kente en zigzag -->
    <path d="M0 132l15-14 15 14 15-14 15 14 15-14 15 14 15-14 15 14 15-14 15 14 15-14 15 14 15-14 15 14 15-14 15 14" stroke="#D9622B" stroke-width="4" stroke-opacity=".2"/>
    <path d="M0 144l15-14 15 14 15-14 15 14 15-14 15 14 15-14 15 14 15-14 15 14 15-14 15 14 15-14 15 14 15-14 15 14" stroke="#FFBF1A" stroke-width="3" stroke-opacity=".26"/>
    <!-- Points bogolan en triangle -->
    <g fill="#0E5F36" fill-opacity=".2">
      <circle cx="40" cy="186" r="3.5"/><circle cx="52" cy="186" r="3.5"/><circle cx="64" cy="186" r="3.5"/>
      <circle cx="46" cy="197" r="3.5"/><circle cx="58" cy="197" r="3.5"/><circle cx="52" cy="208" r="3.5"/>
    </g>
    <!-- Losanges -->
    <g transform="translate(160 196)">
      <path d="M0-22L22 0 0 22-22 0Z" stroke="#7CB82F" stroke-width="4" stroke-opacity=".24"/>
      <path d="M0-10L10 0 0 10-10 0Z" fill="#D9622B" fill-opacity=".22"/>
    </g>
    <!-- Petits éclats -->
    <circle cx="118" cy="30" r="4" fill="#D9622B" fill-opacity=".25"/>
    <circle cx="112" cy="84" r="3" fill="#1FA39A" fill-opacity=".28"/>
    <circle cx="214" cy="160" r="4" fill="#FFBF1A" fill-opacity=".35"/>
    <path d="M100 196l8 8m0-8l-8 8" stroke="#F08A00" stroke-width="3" stroke-opacity=".28"/>
  </g>
</svg>
