<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sesam-Market : hors ligne</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #fff; text-align: center;
    background: #3b4520 radial-gradient(40rem 26rem at 90% -10%, rgb(255 230 170 / .35), transparent 60%);
  }
  .halo { width: min(70vw, 280px); aspect-ratio: 1; margin: 0 auto 8px; display: grid; place-items: center;
    border-radius: 50%; background: radial-gradient(circle, #fff 0%, rgb(251 252 243 / .92) 45%, rgb(219 226 166 / .5) 64%, transparent 72%); }
  .halo img { width: 82%; }
  h1 { font-size: 24px; margin: 8px 0; }
  p { margin: 0 auto 22px; max-width: 30ch; line-height: 1.5; opacity: .95; }
  button { border: 0; border-radius: 14px; padding: 14px 26px; font-size: 16px; font-weight: 700; color: #fff;
    background: linear-gradient(#e2650a, #a8420a); box-shadow: 0 8px 20px -10px rgb(0 0 0 / .6); }
</style>
</head>
<body>
  <main>
    <div class="halo"><img src="logo.webp" alt="Sesam-Market"></div>
    <h1>Pas de connexion</h1>
    <p>Vérifiez votre connexion Internet, puis réessayez. Vos achats groupés vous attendent.</p>
    <button type="button" onclick="location.href='https://sesam-market.onrender.com/?source=app'">Réessayer</button>
  </main>
</body>
</html>
